[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "PDF2Data"
version = "0.2.0rc7"
description = "Source-backed PDF extraction, structured data, validation and local AI repair"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rudra Pratap Singh" }]
keywords = ["embeddings", "vectorize", "local-ai", "rag", "mlx", "cuda"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
mlx = ["mlx-embedding-models>=0.0.11,<0.1", "mlx>=0.32,<0.33", "transformers>=4.44,<5"]
torch = ["torch>=2.2", "transformers>=4.44,<5"]
pdf = ["pdfplumber>=0.11,<1", "pypdf>=5,<7", "pypdfium2>=5.14,<6", "fonttools>=4,<5", "filelock>=3.13,<5", "opencv-python-headless>=4.8,<5"]
ocr-consensus = ["rapidocr>=3.10,<4", "onnxruntime>=1.22,<2", "rapidfuzz>=3,<4"]
pdf-vlm = ["mlx-vlm>=0.7,<0.8", "rapidocr>=3.10,<4", "onnxruntime>=1.22,<2", "pdfplumber>=0.11,<1", "pypdf>=5,<7", "pypdfium2>=5.14,<6", "fonttools>=4,<5", "filelock>=3.13,<5", "opencv-python-headless>=4.8,<5"]
pdf-layout = ["docling>=2.144,<3", "onnxruntime>=1.22,<2", "pypdf>=5,<7"]
test = ["pytest>=8,<10", "pymupdf>=1.26,<2", "rapidocr>=3.10,<4", "onnxruntime>=1.22,<2", "rapidfuzz>=3,<4"]
proof = ["pymupdf>=1.26,<2"]
mcp = ["mcp>=2.3,<3", "filelock>=3.13,<5"]
word = ["python-docx>=1.2,<2"]

[project.urls]
Homepage = "https://github.com/rudraptpsingh/PDF2Data"
Repository = "https://github.com/rudraptpsingh/PDF2Data.git"
Issues = "https://github.com/rudraptpsingh/PDF2Data/issues"
Documentation = "https://github.com/rudraptpsingh/PDF2Data#readme"

[project.scripts]
pdf2data = "local_vector_batch.cli:main"
pdf2data-mcp = "local_vector_batch.mcp_server:main"
local-vector-batch = "local_vector_batch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_vector_batch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

