function render(){
 $('job-count').textContent=jobs.length;$('history').innerHTML=jobs.map(j=>`<button class="job ${j.id===selectedId?'selected':''}" data-job="${j.id}"><strong>${safe(j.title)}</strong><small><span class="dot ${active(j)?'active':['failed','interrupted'].includes(j.status)?'failed':''}"></span>${labels[j.status]} · ${date(j.created_at)}</small></button>`).join('');document.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>{selectedId=b.dataset.job;view='source';render()});
 const j=jobs.find(j=>j.id===selectedId);$('empty').hidden=!!j;$('detail').hidden=!j;if(!j)return;const available=(j.artifacts||[]).filter(a=>a.available).length,total=(j.artifacts||[]).length;
 $('job-header').innerHTML=`<div class="job-title"><div><h1>${safe(j.title)}</h1><p>${safe(j.filename)} · ${safe(j.family.replaceAll('_',' '))} · <span data-elapsed="${j.id}"></span></p></div><span class="chip ${j.metrics?.quality_flags?'warn':''}"><span class="dot ${active(j)?'active':''}"></span>${labels[j.status]}</span></div>`;
 $('run-strip').innerHTML=j.steps.map(s=>`<span class="run-step ${s.status}"><span class="run-step-icon">${s.status==='running'?'<span class="loader"></span>':svg(s.id)}</span><span>${stageNames[s.id]}</span>${s.status==='completed'?'<span class="step-check" aria-label="completed">✓</span>':''}</span>`).join('<span class="run-connector" aria-hidden="true"></span>')+(j.metrics?`<small><span>${j.metrics.pages} ${j.metrics.pages===1?'page':'pages'}</span><span>${j.metrics.tables} ${j.metrics.tables===1?'table':'tables'}</span>${j.metrics.quality_flags?`<span class="flag-count">${j.metrics.quality_flags} ${j.metrics.quality_flags===1?'flag':'flags'}</span>`:''}</small>`:'');
 const preview=artifact(j,artifact(j,'layout')?.available?'layout':'source');
 $('run-outputs').innerHTML=fileIcon(preview,'completed',true,'Preview')+(j.artifacts||[]).filter(a=>a.stage==='export'&&a.id!=='layout').sort((a,b)=>outputOrder.indexOf(a.id)-outputOrder.indexOf(b.id)).map(a=>fileIcon(a,j.steps.find(s=>s.id==='export')?.status,true)).join('')+`<button type="button" class="details-toggle ${view==='pipeline'?'selected':''}" id="details-toggle" aria-pressed="${view==='pipeline'}">${svg('verify')}<span>Details</span></button>`+(j.outputs?`<a class="download-all" href="/jobs/${j.id}/download"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 17v4h16v-4"/></svg>Download all</a>`:'');
 $('details-toggle').onclick=()=>selectView(view==='pipeline'?'source':'pipeline');
 $('run-error').hidden=!j.error;$('run-error').textContent=j.error||'';bindArtifacts();
 $('pipeline-view').hidden=view!=='pipeline';$('viewer').hidden=view==='pipeline';
 if(view==='pipeline'){
  $('pipeline-view').innerHTML=`<section class="run-details"><h2>Run details</h2><dl><dt>Source</dt><dd>${safe(j.filename)}</dd><dt>SHA-256</dt><dd>${safe(j.source_pdf_sha256)}</dd></dl><details><summary>CLI execution</summary><pre>${safe(j.steps.filter(s=>s.command).map(s=>s.command.join(' ')).join('\n\n'))}</pre></details>${['failed','interrupted'].includes(j.status)?'<button class="secondary" id="retry">Retry processing</button>':''}</section>`;
  if($('retry'))$('retry').onclick=async()=>{try{const next=await api(`/api/jobs/${j.id}/retry`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});selectedId=next.id;view='source';await refresh()}catch(e){error(e.message)}};
 }else{
  const a=artifact(j,view==='document'?'html':view);if(!a?.available){selectView('pipeline');return}$('viewer-label').textContent=view==='source'?(artifact(j,'layout')?.available?'Layout · Hover to inspect':'Reading PDF · Layout appears when ready'):a.label+' · '+size(a.bytes);$('viewer-open').href=view==='document'?`/jobs/${j.id}/files/document.html`:a.url;
  const framed=['document','source','layout'].includes(view);$('document-preview').hidden=!framed;$('data-preview').hidden=framed;
  if(framed){const useLayout=view==='layout'||view==='source'&&artifact(j,'layout')?.available;const useReader=view==='document'||useLayout||(view==='source'&&artifact(j,'html')?.available);const key=j.id+':'+view+':'+useReader+':'+Boolean(useLayout);if(frameKey!==key){$('document-preview').src=useReader?`/jobs/${j.id}/files/${useLayout?'layout':'document'}.html?embedded=1${view==='source'?'&mode=source':''}`:a.url;frameKey=key}}
  else{const key=j.id+':'+view;if(dataKey!==key){dataKey=key;$('data-preview').textContent='Loading…';fetch(a.url).then(r=>{if(!r.ok)throw Error('File unavailable');return r.text()}).then(text=>{if(dataKey!==key)return;try{$('data-preview').textContent=JSON.stringify(JSON.parse(text),null,2)}catch{$('data-preview').textContent=text}}).catch(e=>$('data-preview').textContent=e.message)}}
 }tick();
}
function tick(){document.querySelectorAll('[data-elapsed]').forEach(el=>{const j=jobs.find(j=>j.id===el.dataset.elapsed);if(j){const seconds=Math.max(0,(new Date(j.finished_at||Date.now())-new Date(j.created_at))/1000);el.textContent=(seconds<60?seconds.toFixed(1)+'s':Math.floor(seconds/60)+'m '+Math.floor(seconds%60)+'s')+(active(j)?' elapsed':'')}})}
function ingest(result){const snapshot=JSON.stringify(result);jobs=result.jobs;if(!selectedId&&jobs.length)selectedId=jobs[0].id;if(snapshot!==lastSnapshot){lastSnapshot=snapshot;render()}}
async function refresh(){try{ingest(await api('/api/jobs'))}catch(e){$('connection').innerHTML='<span class="dot failed"></span>Reconnecting'}}
$('intake').onsubmit=async e=>{e.preventDefault();if(!chosen||uploading)return;uploading=true;$('start').disabled=true;$('start').innerHTML='<span class="loader"></span> Uploading';$('form-error').hidden=true;try{const query=new URLSearchParams({title:$('title').value,family:$('family').value,url:$('url').value,ocr:$('ocr').value,filename:chosen.name});const j=await api('/api/jobs?'+query,{method:'POST',headers:{'Content-Type':'application/pdf'},body:chosen});selectedId=j.id;view='source';chosen=null;$('file').value='';$('filename').textContent='';await refresh()}catch(e){error(e.message)}finally{uploading=false;$('start').disabled=!chosen;$('start').innerHTML='Process document <span>→</span>'}};
refresh();events=new EventSource('/api/events');events.onopen=()=>$('connection').innerHTML='<span class="dot"></span>Live · Local';events.addEventListener('jobs',event=>ingest(JSON.parse(event.data)));events.onerror=()=>$('connection').innerHTML='<span class="dot active"></span>Reconnecting';setInterval(tick,1000);setInterval(()=>{if(events.readyState!==EventSource.OPEN)refresh()},5000);
</script></body></html>
