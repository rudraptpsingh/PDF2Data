:0;background:transparent;text-align:left;padding:10px 18px;border-left:2px solid transparent}.job:hover{background:#fafaff}.job.selected{background:var(--soft);border-left-color:var(--accent)}.job strong{display:block;font-size:11px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.job small{font-size:9px;color:var(--muted)}.dot{width:6px;height:6px;border-radius:50%;background:var(--success);display:inline-block;margin-right:5px}.dot.active{background:var(--accent);animation:breathe 1.4s infinite}.dot.failed{background:#b8665d}.sidebar-foot{padding:14px 18px;border-top:1px solid var(--line);font-size:10px;color:var(--muted)}.main{min-width:0;display:flex;flex-direction:column;height:100vh}.topbar{height:62px;flex-shrink:0;border-bottom:1px solid var(--line);background:white;padding:0 28px;display:flex;justify-content:space-between;align-items:center}.crumb{font-size:12px;color:var(--muted)}.crumb b{font-weight:500;color:var(--ink)}.connection{font-size:10px;color:var(--muted)}.body{padding:25px 28px;overflow:auto;flex:1;min-height:0}.empty{min-height:430px;display:grid;place-content:center;text-align:center}.empty .glyph{margin:auto;color:var(--accent);background:var(--soft);border:1px solid #e4dfff;border-radius:17px;padding:18px;width:76px;height:76px}.empty h1{font-size:21px;font-weight:600;letter-spacing:-.6px;margin:18px 0 6px}.empty p{font-size:12px;color:var(--muted);margin:0}.empty-flow{display:flex;justify-content:center;gap:20px;font-size:10px;color:var(--muted);margin-top:28px}.job-title{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:18px}.job-title h1{font-size:22px;letter-spacing:-.6px;margin:0 0 5px;font-weight:650}.job-title p{font-size:10px;color:var(--muted);margin:0}.chip{font-size:10px;white-space:nowrap;border:1px solid var(--line);border-radius:20px;padding:5px 10px;background:white}.chip.warn{background:#fffbf2;border-color:#f0e3c8;color:#9a763e}.tabs{display:flex;gap:22px;align-items:center;border-bottom:1px solid var(--line);margin-bottom:20px}.tab{border:0;background:none;font-size:12px;color:var(--muted);padding:0 0 11px;border-bottom:2px solid transparent}.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}.tab:disabled{opacity:.4}.tab-right{margin-left:auto;font-size:10px;color:var(--muted);padding-bottom:11px}.flow-label{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}.flow-label h2{font-size:13px;font-weight:600;margin:0}.flow-label span{font-size:10px;color:var(--muted)}.pipeline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;margin-bottom:18px}.stage{position:relative;border:1px solid var(--line);border-radius:12px;background:white;padding:15px 13px;min-height:150px}.stage:not(:last-child):after{content:'→';position:absolute;right:-18px;top:36px;color:#bebdcc;font-size:12px}.stage.running{border-color:#b9aff9;box-shadow:0 0 0 3px #6d5ce80a}.stage.failed{border-color:#d39a91}.stage-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.stage-icon{width:29px;height:29px;border:1px solid var(--line);border-radius:8px;background:#fafafe;display:grid;place-items:center;color:#9493a7}.completed .stage-icon{background:var(--soft);color:var(--accent);border-color:#e6e0ff}.running .stage-icon{background:var(--accent);color:white;border:0}.stage-state{font-size:9px;color:var(--muted)}.stage h3{font-size:12px;font-weight:600;margin:0 0 12px}.stage-files{display:flex;gap:5px;flex-wrap:wrap}.file-icon{width:32px;height:35px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;position:relative;text-decoration:none;background:#fafaff;border:1px solid #efedf6;font:700 9px ui-monospace,monospace;color:#ceccdb;transition:background .15s,transform .15s}.file-icon.ready{color:var(--accent);background:var(--soft);border-color:#e4ddff;cursor:pointer}.file-icon.ready:hover{transform:translateY(-2px);background:#e8e2ff}.file-icon.ready:after{content:'';position:absolute;right:3px;top:3px;width:4px;height:4px;border-radius:50%;background:var(--success)}.file-icon.generating{border-style:dashed;border-color:#bdb2fa;animation:breathe 1s infinite}.metrics{display:flex;gap:22px;padding:10px 0 18px;border-bottom:1px solid var(--line);font-size:10px;color:var(--muted)}.metrics b{color:var(--ink);font-size:12px;margin-right:4px;font-weight:650}.metrics .quality{color:#a4824d}.outputs{margin-top:18px;border:1px solid var(--line);border-radius:12px;background:white;overflow:hidden}.output-head{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.output-head h2{font-size:12px;margin:0;font-weight:600}.output-head a{font-size:10px;color:var(--accent);text-decoration:none}.output-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line)}.output-item{background:white;padding:14px;display:flex;align-items:center;gap:10px;min-width:0}.output-item strong{font-size:11px;font-weight:500;display:block}.output-item small{font-size:9px;color:var(--muted)}.output-item.locked{opacity:.45}.inspector{margin-top:16px;display:flex;justify-content:space-between;gap:16px;font-size:10px;color:var(--muted)}.inspector summary{cursor:pointer}.inspector pre{font-size:10px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:650px}.error{border:1px solid #efdad6;background:#fff7f5;color:#ac5b50;border-radius:9px;padding:12px;margin:15px 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px}.secondary{border:1px solid var(--line);background:white;border-radius:6px;padding:6px 9px;font-size:11px}.viewer{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden;height:calc(100vh - 222px);min-height:380px;display:flex;flex-direction:column}.viewerbar{height:43px;padding:0 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--muted)}.viewerbar a{text-decoration:none;color:var(--accent)}iframe{border:0;width:100%;flex:1;min-height:0}.data-preview{flex:1;overflow:auto;margin:0;padding:20px;font:11px/1.6 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.loader{display:inline-block;width:11px;height:11px;border:1.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes breathe{50%{opacity:.45}}@media(max-width:1100px){.app{grid-template-columns:230px 1fr}.body{padding:20px}.pipeline{gap:14px}.stage:not(:last-child):after{right:-12px}.stage{padding:12px 10px}.output-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:760px){body{height:auto;overflow:auto}.app{display:block;height:auto}.brand{height:54px}.intake{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.intake .section-label,.drop,.intake details,.start,.filename,.form-error{grid-column:1/-1}.intake .field{display:none}.intake>input,.intake>select{margin-top:10px}.history{max-height:125px;flex:none}.sidebar-foot{display:none}.main{height:auto}.topbar{display:none}.body{overflow:visible;padding:18px}.pipeline{grid-template-columns:1fr 1fr}.stage:nth-child(2):after{display:none}.job-title h1{font-size:18px}.tabs{gap:16px}.output-grid{grid-template-columns:1fr 1fr}.viewer{height:70vh}.tab-right{display:none}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><span class="mark">P</span>PDF2Data<small>OPEN SOURCE</small></div><form class="intake" id="intake"><div class="section-label">NEW DOCUMENT</div><label class="drop" id="drop"><svg width="25" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M12 18v-6m-3 3 3-3 3 3"/></svg><span><strong>Drop a PDF</strong><small>or browse · __MAX_MB__ MB max</small></span><input type="file" id="file" accept="application/pdf,.pdf"></label><div class="filename" id="filename"></div><label class="field" for="title">Title</label><input id="title" type="text" maxlength="240" placeholder="Document title" required><label class="field" for="family">Document type</label><select id="family"><option value="regulation">Regulation</option><option value="draft">Draft</option><option value="record_of_proceedings">Proceedings</option><option value="interim_order">Interim order</option><option value="judgment">Judgment</option><option value="notice">Notice</option><option value="explanatory_memorandum">Explanatory memorandum</option><option value="pleading">Pleading</option><option value="approval">Approval</option><option value="contract">Contract</option><option value="technical_procedure">Technical document</option></select><details><summary>Options</summary><label class="field" for="url">Source URL</label><input id="url" type="url" placeholder="https://"><label class="field" for="ocr">Text recognition</label><select id="ocr"><option value="auto">Automatic</option><option value="off">Native text</option><option value="vision">Apple Vision</option><option value="tesseract">Tesseract</option></select></details><button class="primary start" id="start" disabled>Process document <span>→</span></button><div class="form-error" role="alert" id="form-error" hidden></div></form><div class="history"><div class="history-head"><span>RECENT RUNS</span><span id="job-count">0</span></div><div id="history"></div></div><div class="sidebar-foot"><span class="dot"></span>Local files · No cloud upload</div></aside><section class="main"><header class="topbar"><div class="crumb">Workspace <span style="margin:0 10px">/</span><b>Documents</b></div><span class="connection" id="connection"><span class="dot active"></span>Connecting</span></header><main class="body"><section class="empty" id="empty"><div class="glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M7 3h8l4 4v14H5V3zM15 3v5h4M8 12h8M8 15h8M8 18h5"/></svg></div><h1>PDF in. Structured data out.</h1><p>Add a document to start.</p><div class="empty-flow"><span>Input</span><span>→</span><span>Parse</span><span>→</span><span>Check</span><span>→</span><span>Export</span></div></section><section id="detail" hidden><div id="job-header"></div><nav class="tabs" id="tabs"></nav><div id="pipeline-view"></div><section class="viewer" id="viewer" hidden><div class="viewerbar"><span id="viewer-label"></span><a id="viewer-open" target="_blank" rel="noopener">Open ↗</a></div><iframe id="document-preview" title="Document viewer" hidden></iframe><pre id="data-preview" class="data-preview" hidden></pre></section></section></main></section></div><script>
const TOKEN='__TOKEN__',MAX_MB=Number('__MAX_MB__'),$=id=>document.getElementById(id);let chosen=null,selectedId=null,jobs=[],uploading=false,lastSnapshot='',view='pipeline',frameKey='',dataKey='',events=null;
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={queued:'Queued',running:'Processing',processed:'Ready',processed_with_flags:'Ready · review flags',failed:'Failed',interrupted:'Interrupted'},stageNames={receive:'Input',extract:'Parse',verify:'Check',export:'Export'};
const paths={receive:'M12 16V4m-4 4 4-4 4 4M4 15v5h16v-5',extract:'M8 4H4v4m12-4h4v4M4 16v4h4m12-4v4h-4M8 8h8v8H8z',verify:'m5 12 4 4L19 6',export:'M5 5h14v14H5zM9 12h10m-4-4 4 4-4 4'};
const svg=id=>`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="${paths[id]}"/></svg>`;
const active=j=>['running','queued'].includes(j.status),date=v=>new Date(v).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}),size=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(0)+' KB':(b/1048576).toFixed(1)+' MB';
function error(message){$('form-error').hidden=false;$('form-error').textContent=message}
function choose(file){if(!file)return;if(!file.name.toLowerCase().endsWith('.pdf')||file.size>MAX_MB*1048576){chosen=null;$('start').disabled=true;error('Choose a PDF under '+MAX_MB+' MB.');return}chosen=file;$('url').value='';$('filename').textContent=file.name+' · '+size(file.size);$('title').value=file.name.replace(/\.pdf$/i,'').replaceAll('_',' ');$('start').disabled=false;$('form-error').hidden=true}
$('file').onchange=e=>choose(e.target.files[0]);$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('drag')};$('drop').ondragleave=()=>$('drop').classList.remove('drag');$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('drag');choose(e.dataTransfer.files[0])};
async function api(path,options={}){const response=await fetch(path,{...options,headers:{'X-Local-Token':TOKEN,...options.headers}});const value=await response.json();if(!response.ok)throw Error(value.error||'Request failed');return value}
function artifact(j,id){return (j.artifacts||[]).find(a=>a.id===id)}
function fileIcon(a,stage){if(!a)return '';const title=a.available?a.label+' · '+size(a.bytes):a.label+' · '+(stage==='running'?'generating':'waiting');return a.available?`<a href="${a.url}" data-artifact="${a.id}" class="file-icon ready" title="${safe(title)}" aria-label="Open ${a.label}">${safe(a.icon)}</a>`:`<span class="file-icon ${stage==='running'?'generating':''}" title="${safe(title)}" aria-label="${safe(title)}">${safe(a.icon)}</span>`}
function selectView(next){view=next;render()}
function bindArtifacts(){document.querySelectorAll('[data-artifact]').forEach(a=>a.onclick=event=>{event.preventDefault();const id=a.dataset.artifact;if(id==='html')selectView('document');else if(id==='source')selectView('source');else if(['json','structure','tables','quality','relations','text'].includes(id))selectView(id);else{const download=document.createElement('a');download.href=a.href;download.download=id==='word'?'document.docx':'document.md';download.click()}})}
function render(){
 $('job-count').textContent=jobs.length;$('history').innerHTML=jobs.map(j=>`<button class="job ${j.id===selectedId?'selected':''}" data-job="${j.id}"><strong>${safe(j.title)}</strong><small><span class="dot ${active(j)?'active':['failed','interrupted'].includes(j.status)?'failed':''}"></span>${labels[j.status]} · ${date(j.created_at)}</small></button>`).join('');document.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>{selectedId=b.dataset.job;view='pipeline';render()});
 const j=jobs.find(j=>j.id===selectedId);$('empty').hidden=!!j;$('detail').hidden=!j;if(!j)return;const available=(j.artifacts||[]).filter(a=>a.available).length,total=(j.artifacts||[]).length;
 $('job-header').innerHTML=`<div class="job-title"><div><h1>${safe(j.title)}</h1><p>${safe(j.filename)} · ${safe(j.family.replaceAll('_',' '))} · <span data-elapsed="${j.id}"></span></p></div><span class="chip ${j.metrics?.quality_flags?'warn':''}"><span class="dot ${active(j)?'active':''}"></span>${labels[j.status]}</span></div>`;
 $('tabs').innerHTML=[['pipeline','Pipeline',true],['document','Document',artifact(j,'html')?.available],['source','Source',artifact(j,'source')?.available],['json','Data',artifact(j,'json')?.available]].map(([key,label,enabled])=>`<button class="tab ${view===key?'active':''}" data-view="${key}" ${enabled?'':'disabled'}>${label}</button>`).join('')+`<span class="tab-right">${available}/${total} files</span>`;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>selectView(b.dataset.view));
 $('pipeline-view').hidden=view!=='pipeline';$('viewer').hidden=view==='pipeline';
 if(view==='pipeline'){
  const stages=j.steps.map(s=>`<article class="stage ${s.status}"><div class="stage-top"><div class="stage-icon">${s.status==='running'?'<span class="loader"></span>':svg(s.id)}</div><span class="stage-state">${s.status==='completed'?'Done':s.status==='running'?'Running':s.status==='failed'?'Failed':'Waiting'}</span></div><h3>${stageNames[s.id]}</h3><div class="stage-files">${(j.artifacts||[]).filter(a=>a.stage===s.id).map(a=>fileIcon(a,s.status)).join('')}</div></article>`).join('');
  const metrics=j.metrics?`<div class="metrics">${[['pages','pages'],['paragraphs','paragraphs'],['tables','tables'],['quality_flags','review flags']].map(([key,label])=>`<span class="${key==='quality_flags'&&j.metrics[key]?'quality':''}"><b>${j.metrics[key]}</b>${label}</span>`).join('')}<span><b>0</b>withheld</span></div>`:'';
  const outputItems=(j.artifacts||[]).filter(a=>a.stage==='export').map(a=>`<div class="output-item ${a.available?'':'locked'}">${fileIcon(a,j.steps.find(s=>s.id==='export').status)}<div><strong>${safe(a.label)}</strong><small>${a.available?size(a.bytes):'Waiting'}</small></div></div>`).join('');
  $('pipeline-view').innerHTML=`<div class="flow-label"><h2>Processing pipeline</h2><span>${active(j)?'<span class="dot active"></span>Live · ':''}${available} files available</span></div><div class="pipeline">${stages}</div>${metrics}${j.error?`<div class="error">${safe(j.error)}<br><button class="secondary" id="retry">Retry</button></div>`:''}<div class="outputs"><div class="output-head"><h2>Outputs</h2>${j.outputs?`<a href="/jobs/${j.id}/download">Download all ↓</a>`:'<span class="muted" style="font-size:10px">Available as generated</span>'}</div><div class="output-grid">${outputItems}</div></div><div class="inspector"><details><summary>Run details</summary><pre>${safe(j.steps.filter(s=>s.command).map(s=>s.command.join(' ')).join('\n\n'))}\nSHA256 ${safe(j.source_pdf_sha256)}</pre></details><span>Extracted content · Review flags retained</span></div>`;
  if($('retry'))$('retry').onclick=async()=>{try{const next=await api(`/api/jobs/${j.id}/retry`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});selectedId=next.id;view='pipeline';await refresh()}catch(e){error(e.message)}};bindArtifacts();
 }else{
  const a=artifact(j,view==='document'?'html':view);if(!a?.available){selectView('pipeline');return}$('viewer-label').textContent=a.label+' · '+size(a.bytes);$('viewer-open').href=view==='document'?`/jobs/${j.id}/files/document.html`:a.url;
  const framed=['document','source'].includes(view);$('document-preview').hidden=!framed;$('data-preview').hidden=framed;
  if(framed){const useReader=view==='document'||(view==='source'&&artifact(j,'html')?.available);const key=j.id+':'+view+':'+useReader;if(frameKey!==key){$('document-preview').src=useReader?`/jobs/${j.id}/files/document.html?embedded=1${view==='source'?'&mode=source':''}`:a.url;frameKey=key}}
  else{const key=j.id+':'+view;if(dataKey!==key){dataKey=key;$('data-preview').textContent='Loading…';fetch(a.url).then(r=>{if(!r.ok)throw Error('File unavailable');return r.text()}).then(text=>{if(dataKey!==key)return;try{$('data-preview').textContent=JSON.stringify(JSON.parse(text),null,2)}catch{$('data-preview').textContent=text}}).catch(e=>$('data-preview').textContent=e.message)}}
 }tick();
}
function tick(){document.querySelectorAll('[data-elapsed]').forEach(el=>{const j=jobs.find(j=>j.id===el.dataset.elapsed);if(j){const seconds=Math.max(0,(new Date(j.finished_at||Date.now())-new Date(j.created_at))/1000);el.textContent=(seconds<60?seconds.toFixed(1)+'s':Math.floor(seconds/60)+'m '+Math.floor(seconds%60)+'s')+(active(j)?' elapsed':'')}})}
function ingest(result){const snapshot=JSON.stringify(result);jobs=result.jobs;if(!selectedId&&jobs.length)selectedId=jobs[0].id;if(snapshot!==lastSnapshot){lastSnapshot=snapshot;render()}}
async function refresh(){try{ingest(await api('/api/jobs'))}catch(e){$('connection').innerHTML='<span class="dot failed"></span>Reconnecting'}}
$('intake').onsubmit=async e=>{e.preventDefault();if(!chosen||uploading)return;uploading=true;$('start').disabled=true;$('start').innerHTML='<span class="loader"></span> Uploading';$('form-error').hidden=true;try{const query=new URLSearchParams({title:$('title').value,family:$('family').value,url:$('url').value,ocr:$('ocr').value,filename:chosen.name});const j=await api('/api/jobs?'+query,{method:'POST',headers:{'Content-Type':'application/pdf'},body:chosen});selectedId=j.id;view='pipeline';chosen=null;$('file').value='';$('filename').textContent='';await refresh()}catch(e){error(e.message)}finally{uploading=false;$('start').disabled=!chosen;$('start').innerHTML='Process document <span>→</span>'}};
refresh();events=new EventSource('/api/events');events.onopen=()=>$('connection').innerHTML='<span class="dot"></span>Live · Local';events.addEventListener('jobs',event=>ingest(JSON.parse(event.data)));events.onerror=()=>$('connection').innerHTML='<span class="dot active"></span>Reconnecting';setInterval(tick,1000);setInterval(()=>{if(events.readyState!==EventSource.OPEN)refresh()},5000);
</script></body></html>
