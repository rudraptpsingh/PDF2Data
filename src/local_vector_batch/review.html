<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Source review · Powerlex</title><style>
:root{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#29372d;background:#f6f7f4;accent-color:#2d654b}*{box-sizing:border-box}body{margin:0;height:100dvh;overflow:hidden}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #d7dfd3;border-radius:7px;background:#fff;color:#35543f;padding:8px 11px;min-height:35px}button:hover{background:#f0f5ed}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #9dc4ad;outline-offset:2px}a{color:#38694d;text-underline-offset:3px}header{height:49px;padding:0 20px;border-bottom:1px solid #e0e6db;background:#fff;display:flex;align-items:center;justify-content:space-between}header h1{font-size:15px;margin:0;font-weight:650}header span{font-size:12px;color:#7c8877}main{height:calc(100dvh - 49px);max-width:1250px;margin:auto;padding:12px 20px;display:flex;flex-direction:column;gap:10px;min-height:0}.nav{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-shrink:0}.nav strong{font-size:13px;display:block;overflow-wrap:anywhere}.muted{font-size:11px;color:#7a8674}.buttons{display:flex;gap:6px;align-items:center}.tabs{display:flex;gap:6px}.tabs button[aria-pressed=true]{background:#e9f2e7;border-color:#719c7d;color:#28583a}.source-card{background:#fff;border:1px solid #dfe5d9;border-radius:10px;display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}.source-head{padding:9px 13px;display:flex;align-items:center;justify-content:space-between;gap:8px}.source-head strong{font-size:12px}.source-head button,.source-head a{font-size:11px;padding:5px 8px;min-height:28px}.source-image{height:clamp(100px,25dvh,230px);background:#f4f6f0;min-height:0}.source-image img{display:block;width:100%;height:100%;object-fit:contain}.grid-section{flex-shrink:1;min-height:76px;max-height:24dvh;overflow:auto;border:1px solid #dfe5d9;border-radius:8px;background:#fff}.grid-section table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:10px}.grid-section th,.grid-section td{border:1px solid #e0e6db;padding:0;vertical-align:top}.grid-section button{width:100%;height:100%;min-height:40px;padding:7px 4px;border:0;border-radius:0;font-size:10px;line-height:1.3;overflow-wrap:anywhere;position:relative}.grid-section th button{background:#f0f4ec;color:#58674f}.grid-section button .label{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.grid-section button.current{box-shadow:inset 0 0 0 2px #33704e;background:#e9f4e6}.grid-section button.reviewed::after{content:'✓';position:absolute;right:2px;top:0;color:#2e7443}.grid-section button.different{background:#fff7da}.selection{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0}.selection h2{font-size:13px;margin:0}.selection select{max-width:45%;font-size:11px;padding:7px;border:1px solid #d7dfd1;border-radius:6px;background:#fff}.readings{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:65px;flex:1;overflow:hidden}.reading{border:1px solid #dfe5d8;background:#fff;border-radius:9px;padding:11px 13px;min-width:0;display:flex;flex-direction:column;min-height:0}.reading h3{font-size:10px;color:#788570;font-weight:600;margin:0 0 6px;text-transform:uppercase;letter-spacing:.06em}.reading pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;overflow:auto;font:14px/1.55 ui-monospace,SFMono-Regular,monospace;flex:1;min-height:0}.reading mark{background:#fff0b3;border-radius:2px}.decision{border-top:1px solid #dfe5d8;flex-shrink:0;padding-top:10px}.decision-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.decision-top strong{font-size:12px}.decision-top label{font-size:11px;color:#788570}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.choices button{font-size:12px;padding:10px}.choices button.primary{background:#2f674c;color:white;border-color:#2f674c}.status{font-size:11px;min-height:17px;color:#3f7151;margin-top:5px}.correction{display:flex;gap:7px;margin-bottom:8px}.correction input{flex:1;min-width:0;border:1px solid #bdcfb8;border-radius:6px;padding:8px}dialog{border:1px solid #dfe5d9;border-radius:12px;padding:14px;width:min(1000px,95vw);max-height:92dvh}dialog::backdrop{background:#1c2b2466}dialog .doc{max-height:78dvh;overflow:auto;margin-top:10px}dialog img{width:100%;height:auto}#reason{font-size:11px;color:#6f7f66;max-height:140px;overflow:auto;white-space:pre-wrap}.summary{font-size:11px;color:#788570}.hidden,[hidden]{display:none!important}@media(max-width:700px){main{padding:10px;gap:8px}header{padding:0 12px}.nav{gap:7px;flex-wrap:wrap}.nav strong{font-size:12px}.tabs button{font-size:11px;padding:6px 8px}.nav .buttons button{font-size:11px}.source-image{height:21dvh}.source-head{padding:7px 10px}.grid-section{max-height:18dvh}.grid-section button{font-size:9px;min-height:36px;padding:5px 2px}.selection{align-items:flex-start}.selection h2{font-size:11px}.reading{padding:9px}.reading pre{font-size:12px}.choices{gap:5px;grid-template-columns:1fr 1fr}.choices button{padding:8px;font-size:11px}.decision{padding-top:7px}.readings{gap:8px}.source-head a{display:none}}@media(max-height:650px){header{height:40px}main{height:calc(100dvh - 40px);gap:6px;padding-top:8px;padding-bottom:8px}.source-image{height:19dvh}.grid-section{max-height:14dvh}.choices button{padding:7px}.reading{padding:8px}.nav strong{font-size:11px}}
</style></head><body><header><h1>Powerlex <span>/ Source review</span></h1><a href="/">PDF tool</a></header><main>
<div class="nav"><div><strong id="title">Loading source…</strong><div class="summary" id="progress"></div></div><div class="tabs" id="tableTabs"></div><div class="buttons"><button id="previous">← Previous</button><button id="next">Next →</button></div></div>
<section class="source-card"><div class="source-head"><strong id="sourceLabel">Original source</strong><div class="buttons"><button id="openContext">Full page</button><button id="why">Why flagged</button><a id="sourceLink" target="_blank" rel="noopener noreferrer">Open PDF ↗</a></div></div><div class="source-image"><img id="image" alt="Original source for the selected illustration or region"></div></section>
<div class="grid-section" id="grid" hidden></div><div class="selection"><h2 id="selectionTitle">Resolve the selected region</h2><select id="jump" aria-label="Choose cell or difference"></select></div>
<div class="readings"><section class="reading"><h3 id="leftLabel">Extracted value</h3><pre id="left"></pre></section><section class="reading"><h3 id="rightLabel">Independent source read</h3><pre id="right"></pre></section></div>
<footer class="decision"><div class="decision-top"><strong id="decisionHint">Choose the value supported by the source</strong><label><input type="checkbox" id="autoNext" checked>Next after saving</label></div><div class="correction" id="correction" hidden><input id="correctedValue" aria-label="Correct value" placeholder="Enter the value shown in the original"><button id="saveCorrection">Save correction</button><button id="cancelCorrection">Cancel</button></div><div class="choices"><button id="acceptLeft" class="primary">Accept extracted · A</button><button id="acceptRight">Accept other · B</button><button id="edit">Correct value · C</button><button id="unclear">Cannot tell · U</button></div><div class="status" id="message" role="status" aria-live="polite"></div></footer>
</main><dialog id="context"><div class="buttons"><strong id="dialogTitle">Full original page</strong><button id="closeDialog">Close</button></div><div class="doc" id="fullDoc"><img id="fullImage" alt="Full original PDF page"></div><pre id="reason" hidden></pre></dialog>
<script>
const token='__TOKEN__',$=id=>document.getElementById(id),params=new URLSearchParams(location.search);let index=Math.max(0,Number(params.get('index'))||0),item=null,tableIndex=Math.max(0,Number(params.get('table'))||0),cell=null,group=[],busy=false,initial=true;
async function api(url,method='GET',body){const r=await fetch(url,{method,headers:{'X-Local-Token':token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});const x=await r.json();if(!r.ok)throw Error(x.error||'Request failed');return x}
function table(){return item?.table_previews?.[tableIndex]||null}function cells(){const t=table();return t?[...t.cell_spans.filter(c=>c.row>0),...t.cell_spans.filter(c=>c.row===0)]:[]}
function text(node,value){node.textContent=value||'∅'}function segments(node,parts,fallback){node.replaceChildren();if(!parts?.length){text(node,fallback);return}for(const part of parts){const s=document.createElement(part.changed?'mark':'span');s.textContent=part.text;node.appendChild(s)}}
function setBusy(value){busy=value;document.querySelectorAll('.choices button,#saveCorrection,#previous,#next,#tableTabs button,#grid button,#jump').forEach(b=>b.disabled=value)}
function source(){const t=table();$('image').src=(t?'/api/review-image?table='+tableIndex: item.focus?.boxes?.length?'/api/review-focus?':'/api/review-image?')+(t?'&':'')+'index='+index+'&token='+encodeURIComponent(token);$('sourceLabel').textContent='Original · page '+item.page+(t?' · '+t.caption:' · selected region');$('sourceLink').hidden=!item.source_url;if(item.source_url)$('sourceLink').href=item.source_url}
function chooseCell(next){if(!$('correction').hidden){$('message').textContent='Save or cancel the correction before changing cells.';return}cell=next;$('correction').hidden=true;renderSelection();renderGrid()}
function headerFor(c){const t=table();const h=t.cell_spans.find(x=>x.row===0&&x.column<=c.column&&x.column+x.column_span>c.column);return h?.text?.replace(/\s+/g,' ').trim()||'Column '+(c.column+1)}
function renderGrid(){const t=table();$('grid').hidden=!t;$('grid').replaceChildren();if(!t)return;const el=document.createElement('table');el.setAttribute('aria-label',t.caption+' reconstructed cells');for(let r=0;r<t.row_count;r++){const tr=document.createElement('tr');for(const c of t.cell_spans.filter(x=>x.row===r).sort((a,b)=>a.column-b.column)){const td=document.createElement(r===0?'th':'td');td.rowSpan=c.row_span;td.colSpan=c.column_span;const b=document.createElement('button');b.title=headerFor(c)+' · '+(c.text||'Blank');b.className=(cell?.id===c.id?'current ':'')+(!c.readers_agree?'different ':'')+(c.saved_feedback?'reviewed':'');b.setAttribute('aria-label',t.caption+', row '+(c.row+1)+', '+headerFor(c)+': '+(c.text||'Blank'));const label=document.createElement('span');label.className='label';label.textContent=(c.text||'—').replace(/\s+/g,' ');b.appendChild(label);b.onclick=()=>chooseCell(c);td.appendChild(b);tr.appendChild(td)}el.appendChild(tr)}$('grid').appendChild(el)}
function renderSelection(){const t=table();$('jump').replaceChildren();if(t){const list=cells();for(const [n,c]of list.entries()){const op=document.createElement('option');op.value=c.id;op.textContent=(c.row===0?'Header · ':'')+headerFor(c)+(c.saved_feedback?' ✓':'');$('jump').appendChild(op)}if(!cell||!t.cell_spans.some(c=>c.id===cell.id))cell=list[0];$('jump').value=cell.id;$('selectionTitle').textContent=t.caption+' · '+headerFor(cell)+' · row '+(cell.row+1);text($('left'),cell.text);text($('right'),cell.independent_text);$('leftLabel').textContent='Extracted cell value';$('rightLabel').textContent='Independent read of this same cell';$('decisionHint').textContent=cell.readers_agree?'Both readers agree · confirm against the source':'Resolve this cell value';$('acceptRight').hidden=cell.readers_agree;$('acceptLeft').textContent=cell.readers_agree?'Confirm value · A':'Accept extracted · A';$('message').textContent=cell.saved_feedback?'Cell feedback saved for repair and revalidation.':'';history.replaceState(null,'','/review?index='+index+'&table='+tableIndex+'&row='+cell.row+'&col='+cell.column)}else{$('selectionTitle').textContent='Resolve the highlighted source region';for(const d of group){const op=document.createElement('option');op.value=d.index;op.textContent=d.prompt.split(' source_render:')[0].split(' layout:')[0]+(d.reviewed?' ✓':'');$('jump').appendChild(op)}$('jump').value=index;segments($('left'),item.focus_selected_segments,item.selected_text);segments($('right'),item.focus_independent_segments,item.independent_text);$('acceptRight').hidden=false;$('acceptLeft').textContent='Accept extracted · A';$('decisionHint').textContent='Choose the reading supported by this source region';$('message').textContent=item.saved_feedback?'Feedback saved locally.':'';history.replaceState(null,'','/review?index='+index)}}
async function load(){setBusy(true);try{item=await api('/api/review-item?index='+index);const g=await api('/api/review-group?index='+index);group=g.differences;tableIndex=Math.min(tableIndex,Math.max(0,(item.table_previews?.length||1)-1));$('title').textContent=item.title.replace(' · extraction repair_required','');$('tableTabs').replaceChildren();if(item.table_previews?.length){for(const [n,t]of item.table_previews.entries()){const b=document.createElement('button');b.textContent=t.caption;b.setAttribute('aria-pressed',String(n===tableIndex));b.onclick=()=>{if(!$('correction').hidden){$('message').textContent='Save or cancel the correction first.';return}const col=cell?.column;tableIndex=n;cell=cells().find(c=>c.row>0&&c.column===col)||cells()[0];loadView()};$('tableTabs').appendChild(b)}const t=table();if(initial&&params.has('row'))cell=t.cell_spans.find(c=>c.row===Number(params.get('row'))&&c.column===Number(params.get('col')))||null;else cell=null;$('progress').textContent=item.table_previews.length+' separate source tables · review one cell at a time'}else{$('progress').textContent='Difference '+(index+1)+' of '+item.total}initial=false;loadView()}catch(e){$('message').textContent=e.message}finally{setBusy(false)}}
function loadView(){document.querySelectorAll('#tableTabs button').forEach((b,n)=>b.setAttribute('aria-pressed',String(n===tableIndex)));source();renderSelection();renderGrid()}
async function move(direction){if(busy)return;if(!$('correction').hidden){$('message').textContent='Save or cancel the correction before moving.';return}const list=cells();if(table()){const pos=list.findIndex(c=>c.id===cell?.id)+direction;if(pos>=0&&pos<list.length){chooseCell(list[pos]);return}if(direction>0&&tableIndex+1<item.table_previews.length){tableIndex++;cell=cells()[0];loadView();return}if(direction<0&&tableIndex>0){tableIndex--;cell=cells()[0];loadView();return}$('message').textContent='End of this source table. Choose another cell or illustration.';return}const next=index+direction;if(next<0||next>=item.total)return;index=next;await load()}
$('jump').onchange=e=>{if(table())chooseCell(cells().find(c=>c.id===e.target.value));else{index=Number(e.target.value);load()}};$('previous').onclick=()=>move(-1);$('next').onclick=()=>move(1);
async function save(decision,correction=''){if(busy||!item)return;setBusy(true);try{const t=table();const reviewedCell=cell;if(t){await api('/api/review-cell-decision','POST',{index,source_pdf_sha256:item.source_pdf_sha256,page:item.page,table_version_id:t.table_version_id,cell_id:cell.id,selected_cell_sha256:cell.selected_cell_sha256,independent_cell_sha256:cell.independent_cell_sha256,decision,correction});reviewedCell.saved_feedback={decision,correction};renderGrid()}else{await api('/api/review-decision','POST',{index,decision:decision==='corrected'?'neither':decision,note:correction,source_pdf_sha256:item.source_pdf_sha256,page:item.page,selected_text_sha256:item.selected_text_sha256,independent_text_sha256:item.independent_text_sha256,prompt_sha256:item.prompt_sha256,focus_sha256:item.focus_sha256,proposal_sha256:item.proposal_sha256})}$('correction').hidden=true;$('message').textContent='Saved for source revalidation.';setBusy(false);if($('autoNext').checked)await move(1)}catch(e){$('message').textContent=e.message}finally{setBusy(false)}}
$('acceptLeft').onclick=()=>save('selected');$('acceptRight').onclick=()=>save('independent');$('unclear').onclick=()=>save('unclear');$('edit').onclick=()=>{$('correctedValue').value=cell?.text||'';$('correction').hidden=false;$('correctedValue').focus()};$('cancelCorrection').onclick=()=>{$('correction').hidden=true};$('saveCorrection').onclick=()=>{if(!$('correctedValue').value.trim()){$('message').textContent='Enter the value shown in the source.';return}save('corrected',$('correctedValue').value)};$('correctedValue').onkeydown=e=>{if(e.key==='Enter')$('saveCorrection').click()};
$('openContext').onclick=()=>{$('dialogTitle').textContent='Full original · page '+item.page;$('reason').hidden=true;$('fullDoc').hidden=false;$('fullImage').src='/api/review-image?index='+index+'&token='+encodeURIComponent(token);$('context').showModal()};$('why').onclick=()=>{$('dialogTitle').textContent='Source discrepancy';$('fullDoc').hidden=true;$('reason').hidden=false;$('reason').textContent=item.prompt;$('context').showModal()};$('closeDialog').onclick=()=>$('context').close();
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select')||e.metaKey||e.ctrlKey||e.altKey||e.repeat||$('context').open)return;const key=e.key.toLowerCase();if(key==='a'){e.preventDefault();save('selected')}else if(key==='b'&&!$('acceptRight').hidden){e.preventDefault();save('independent')}else if(key==='c')$('edit').click();else if(key==='u')save('unclear');else if(e.key==='ArrowRight')move(1);else if(e.key==='ArrowLeft')move(-1)});load();
</script></body></html>
