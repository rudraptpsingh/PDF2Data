name: Release
env:
  PYTHONUTF8: '1'
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - uses: astral-sh/setup-uv@v6
      - run: python -m pip install -e '.[pdf,mcp,word,test]' build twine
      - run: python -m pytest -q
      - run: npm --prefix npm ci --ignore-scripts
      - run: npm --prefix npm test
      - name: Check release versions and tag
        shell: bash
        run: |
          python scripts/release_checks.py > /tmp/release-versions.json
          tag=$(python -c 'import json; print(json.load(open("/tmp/release-versions.json"))["tag"])')
          test "$GITHUB_REF_NAME" = "$tag"
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/release_checks.py --dist dist
      - name: Install and inspect the built wheel outside the checkout
        shell: bash
        run: |
          python -m venv /tmp/pdf2data-wheel
          /tmp/pdf2data-wheel/bin/python -m pip install "$(realpath dist/*.whl)[pdf,mcp,word]"
          cd /tmp
          /tmp/pdf2data-wheel/bin/pdf2data --version
          /tmp/pdf2data-wheel/bin/pdf2data doctor
          /tmp/pdf2data-wheel/bin/pdf2data-mcp --help
      - name: Assemble release files
        shell: bash
        run: |
          (cd npm && npm pack --pack-destination "$GITHUB_WORKSPACE/dist")
          python -c 'import shutil; shutil.make_archive("dist/pdf2data-skill", "zip", "skills", "pdf2data")'
          cd dist
          sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub prerelease or release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "PDF2Data $GITHUB_REF_NAME" --notes-file CHANGELOG.md "${flags[@]}"
      - name: Publish npm package
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then tag=next; else tag=latest; fi
          npm publish --access public --provenance --tag "$tag"
